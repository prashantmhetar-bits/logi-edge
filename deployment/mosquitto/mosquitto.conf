listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

max_queued_messages 10000
max_inflight_messages 20

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

connection freightbridge-ops
address ops.freightbridge.example:8883
remote_clientid logibridge-edge-truck_001

cleansession false
local_cleansession false
try_private true
restart_timeout 5 60
keepalive_interval 60
notifications true
notification_topic logibridge/trucks/truck_001/bridge

topic logibridge/trucks/+/alerts out 1
topic logibridge/trucks/+/status out 1

bridge_cafile /mosquitto/certs/freightbridge-ca.crt
bridge_certfile /mosquitto/certs/truck_001.crt
bridge_keyfile /mosquitto/certs/truck_001.key
bridge_tls_version tlsv1.3