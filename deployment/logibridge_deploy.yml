---
# LogiBridge edge deployment (Task E2) - exactly 7 tasks, idempotent:
# a second run with no changes reports changed=0.
#
# Run from the repository root:
#   ansible-playbook -i deployment/inventory.ini deployment/logibridge_deploy.yml
- name: Deploy LogiBridge inference container to the truck edge node
  hosts: edge_nodes
  become: true
  gather_facts: false
  vars:
    logibridge_dir: /opt/logibridge
    # M3 per Task F3; roll back to M2 with -e model_src=<path to cold_chain_mlp_ptq_int8.tflite>
    model_src: "{{ playbook_dir }}/../training/models/cold_chain_mlp_pruned_int8.tflite"
    reference_src: "{{ playbook_dir }}/../monitoring/reference_dist.json"
    registry: localhost:5000
    image_name: "{{ registry }}/logi-edge"
    image_tag: v1
    container_name: logibridge-inference
    truck_id: truck_001
    mqtt_broker: localhost
    mqtt_port: "1883"

  tasks:
    - name: "1/7 Create deployment directory if not present: {{ logibridge_dir }}"
      ansible.builtin.file:
        path: "{{ logibridge_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "2/7 Copy new model file to model.tflite in {{ logibridge_dir }}"
      ansible.builtin.copy:
        src: "{{ model_src }}"
        dest: "{{ logibridge_dir }}/model.tflite"
        owner: root
        group: root
        mode: "0644"
      register: model_copy

    - name: "3/7 Copy reference_dist.json"
      ansible.builtin.copy:
        src: "{{ reference_src }}"
        dest: "{{ logibridge_dir }}/reference_dist.json"
        owner: root
        group: root
        mode: "0644"
      register: reference_copy

    # Only when the model or reference changed: the container reads them at start-up,
    # so it must be restarted to pick them up. Otherwise skipped (keeps changed=0).
    - name: "4/7 Stop running inference container (only if model/reference changed)"
      ansible.builtin.shell: |
        set -o pipefail
        if docker ps --quiet --filter "name=^{{ container_name }}$" | grep -q .; then
          docker stop "{{ container_name }}" > /dev/null
          echo stopped
        fi
      args:
        executable: /bin/bash
      register: stop_result
      changed_when: "'stopped' in stop_result.stdout"
      when: model_copy.changed or reference_copy.changed

    # force_source re-checks the registry every run; reports changed only if the image ID changed.
    - name: "5/7 Pull updated container image from local registry"
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true
      tags: [pull]

    # Recreates only if image or configuration differs; starts the container if it was stopped.
    - name: "6/7 Start inference container with environment variables"
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        mounts:
          - type: bind
            source: "{{ logibridge_dir }}"
            target: "{{ logibridge_dir }}"
            read_only: true
        env:
          MODEL_PATH: "{{ logibridge_dir }}/model.tflite"
          TRUCK_ID: "{{ truck_id }}"
          MQTT_BROKER: "{{ mqtt_broker }}"
          MQTT_PORT: "{{ mqtt_port }}"

    - name: "7/7 Wait 15 seconds and verify the container is running"
      ansible.builtin.shell: |
        sleep 15
        docker inspect --format '{{ "{{" }}.State.Running{{ "}}" }} {{ "{{" }}.RestartCount{{ "}}" }}' "{{ container_name }}"
      register: health
      changed_when: false
      failed_when: health.rc != 0 or health.stdout.split() != ['true', '0']
