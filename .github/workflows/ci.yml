name: LogiEdge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TRAIN_DEPS: tensorflow==2.21.0 keras==3.15.1 numpy==2.4.6 pandas==3.1.0 scikit-learn==1.9.1
  PRUNE_DEPS: tensorflow-model-optimization==0.8.1 tf-keras==2.21.0
  BENCH_DEPS: psutil==7.2.2 matplotlib==3.11.2
  ANSIBLE_DEPS: ansible==14.5.0 ansible-lint==26.10.1 docker==7.2.0
  IMAGE: logi-edge:ci
  MODEL: cold_chain_mlp_pruned_int8.tflite

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: "Checks: unit tests, Dockerfile rules, playbook = 7 tasks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest paho-mqtt==2.1.0 numpy==2.4.6 pyyaml==6.0.3

      - name: Syntax check and unit tests
        run: |
          python -m compileall -q data_pipeline training optimisation inference monitoring tests scripts
          pytest -v tests

      - name: "D2: Dockerfile rules"
        run: python scripts/ci_summary.py dockerfile inference/Dockerfile

      - name: "E2: playbook has exactly 7 tasks"
        run: python scripts/ci_summary.py playbook deployment/logibridge_deploy.yml

      - name: "C2: training statistics"
        run: python scripts/ci_summary.py stats data_pipeline/training_stats.npy

  models:
    name: "Models: M1 FP32, M2 PTQ INT8, M3 pruned INT8 (D1/F1)"
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training dependencies
        run: pip install $TRAIN_DEPS $PRUNE_DEPS

      - name: "M1: train FP32 (gates: accuracy > 88%, Critical recall > 95%)"
        run: python training/train_model.py 2>&1 | tee m1_train.log

      - name: "M2: full INT8 post-training quantisation"
        run: python training/convert_ptq.py 2>&1 | tee m2_convert.log

      - name: "M3: 35% structured pruning + INT8"
        run: python training/prune_quantise.py 2>&1 | tee m3_prune.log

      - name: Quality gates summary
        run: python scripts/ci_summary.py metrics optimisation/results/metrics_m*.json

      - name: Upload models
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: models
          path: |
            training/models/
            optimisation/results/metrics_m*.json
            m*_*.log
          if-no-files-found: error
          retention-days: 14

  evaluate:
    name: "Evaluate: C2 normalisation experiment + F2 benchmark"
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: models

      - name: Install dependencies
        run: pip install $TRAIN_DEPS $BENCH_DEPS

      - name: "C2: accuracy with correct stats vs stats shifted by 3 sigma"
        run: python data_pipeline/normalisation_experiment.py

      - name: "F2: five-metric benchmark (10 warm-up + 200 timed runs) and Pareto chart"
        run: |
          python optimisation/benchmark.py --tdp-w 15
          python optimisation/pareto.py
          python scripts/ci_summary.py benchmark optimisation/results/benchmark_results.json

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evaluation
          path: |
            data_pipeline/results/normalisation_experiment.json
            optimisation/results/benchmark_results.json
            optimisation/results/benchmark_results.csv
            optimisation/results/pareto_chart.png
          retention-days: 30

  ota-demo:
    name: "OTA: only the model layer is rebuilt; bandwidth for 85 trucks (D2)"
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: models
          path: ${{ runner.temp }}/new

      - name: Build v1, change only the model, rebuild v2, measure layers
        run: bash scripts/ota_layer_demo.sh "$RUNNER_TEMP/new/training/models/cold_chain_mlp_pruned_int8.tflite" "$RUNNER_TEMP/ota"

      - name: Upload OTA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ota-demo
          path: ${{ runner.temp }}/ota/
          retention-days: 30

  deploy:
    name: "Deploy: MQTT integration and offline store-and-forward (C1/D2)"
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: models

      - name: Build inference image
        run: docker build -f inference/Dockerfile -t "$IMAGE" .

      - name: Start Mosquitto and the sensor simulator (--anomaly combined)
        run: |
          pip install paho-mqtt==2.1.0 pyyaml==6.0.3
          printf 'listener 1883\nallow_anonymous true\n' > "$RUNNER_TEMP/mosquitto.conf"
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$RUNNER_TEMP/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
          nohup python data_pipeline/simulator.py --anomaly combined > "$RUNNER_TEMP/simulator.log" 2>&1 &

      - name: "Integration: same image, three models via MODEL_PATH"
        run: |
          for model in cold_chain_mlp_fp32.keras cold_chain_mlp_ptq_int8.tflite cold_chain_mlp_pruned_int8.tflite; do
            bash scripts/integration_test.sh "$IMAGE" "$model" truck_001
          done
          python scripts/ci_summary.py payloads "$RUNNER_TEMP"

      - name: "Offline store-and-forward: alerts raised in a coverage gap reach the ops centre"
        run: bash scripts/offline_sync_test.sh truck_001 5

      - name: Container logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/it-*/container.log; do
            echo "::group::$f"; tail -n 40 "$f"; echo "::endgroup::"
          done

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment
          path: |
            ${{ runner.temp }}/it-*/
            ${{ runner.temp }}/offline-sync/received.jsonl
          retention-days: 30

  psi-drift:
    name: "E1: PSI drift monitoring (inject fault, alert, recover)"
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REF_SIZE: "30"
      WINDOW: "30"
      INTERVAL: "20"
      MIN_SAMPLES: "6"
      CLEAN_MIN: "6"
      HOLD_AFTER_ALERT_S: "60"
      RECOVER_MAX_MIN: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install simulator and monitor dependencies
        run: pip install paho-mqtt==2.1.0 matplotlib==3.11.2

      - name: Build the inference image
        run: docker build -f inference/Dockerfile -t "$IMAGE" .

      - name: Start the truck's MQTT broker
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf

      - name: "Reference -> monitor -> inject --anomaly combined -> DRIFT ALERT -> restore -> recovered"
        run: |
          echo "Demo settings: reference $REF_SIZE, window $WINDOW, PSI every ${INTERVAL}s (brief: 300 / 100 / 60s)"
          bash scripts/psi_drift_demo.sh "$IMAGE" "$MODEL" truck_001 "$RUNNER_TEMP/psi"

      - name: Upload PSI evidence (timeline chart, logs, reference)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e1-psi-drift
          path: ${{ runner.temp }}/psi/
          retention-days: 30

  ansible:
    name: "E2: Ansible deployment playbook (run twice, second run changed=0)"
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANSIBLE_FORCE_COLOR: "0"
      ANSIBLE_LOCALHOST_WARNING: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the inference image and push it to the local registry
        run: |
          docker build -f inference/Dockerfile -t "$IMAGE" .
          docker run -d --name registry -p 5000:5000 registry:2
          for _ in $(seq 1 30); do curl -sf http://localhost:5000/v2/ > /dev/null && break; sleep 1; done
          docker tag "$IMAGE" localhost:5000/logi-edge:v1
          docker push localhost:5000/logi-edge:v1

      - name: Start broker and clean sensor simulator
        run: |
          pip install paho-mqtt==2.1.0 pyyaml==6.0.3
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          nohup python data_pipeline/simulator.py --anomaly none > "$RUNNER_TEMP/simulator.log" 2>&1 &

      - name: Build a clean reference_dist.json for the playbook to deploy
        run: |
          docker run -d --name ref-inference --network host \
            -e MODEL_PATH="$MODEL" -e TRUCK_ID=ref -e MQTT_BROKER=localhost "$IMAGE"
          python monitoring/drift_monitor.py --mode reference --reference-size 6 \
            --truck-id ref --reference "$RUNNER_TEMP/reference_dist.json"
          docker rm -f ref-inference

      - name: Install Ansible and lint the playbook
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet $ANSIBLE_DEPS
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible/bin/ansible-lint" deployment/logibridge_deploy.yml

      - name: "Ansible run 1: deploy to the truck"
        run: |
          ansible-playbook -i deployment/inventory.ini deployment/logibridge_deploy.yml \
            -e reference_src="$RUNNER_TEMP/reference_dist.json" | tee "$RUNNER_TEMP/run1.log"

      - name: "Ansible run 2: same command, nothing changed"
        run: |
          ansible-playbook -i deployment/inventory.ini deployment/logibridge_deploy.yml \
            -e reference_src="$RUNNER_TEMP/reference_dist.json" | tee "$RUNNER_TEMP/run2.log"
          python scripts/ci_summary.py ansible "$RUNNER_TEMP/run1.log" "$RUNNER_TEMP/run2.log"
          grep -E '^truck_001 +:' "$RUNNER_TEMP/run2.log" | grep -Eq 'changed=0 .*failed=0' \
            || { echo "::error::second run is not idempotent"; exit 1; }

      - name: The deployed container is live
        run: |
          docker ps --filter name=logibridge-inference
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' logibridge-inference | grep -E 'MODEL_PATH|TRUCK_ID'
          docker exec mosquitto mosquitto_sub -t "logibridge/trucks/truck_001/inference" -C 2 -W 60
          docker logs logibridge-inference 2>&1 | tail -n 8

      - name: Upload Ansible evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ansible
          path: |
            ${{ runner.temp }}/run1.log
            ${{ runner.temp }}/run2.log
            ${{ runner.temp }}/reference_dist.json
          retention-days: 30
