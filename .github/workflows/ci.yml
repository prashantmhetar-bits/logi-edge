name: logi-edge-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TRAIN_DEPS: tensorflow==2.21.0 keras==3.15.1 numpy==2.4.6 pandas==3.1.0 scikit-learn==1.9.1
  PRUNE_DEPS: tensorflow-model-optimization==0.8.1 tf-keras==2.21.0
  IMAGE_NAME: logi-edge

defaults:
  run:
    shell: bash

jobs:
  sanity:
    name: Repo sanity check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show repository layout
        run: find . -path ./.git -prune -o -type f -print | sort

      - name: Verify required files exist
        run: |
          for f in \
            dataset_normal.csv dataset_warning.csv dataset_critical.csv \
            data_pipeline/simulator.py data_pipeline/preprocessing.py data_pipeline/training_stats.npy \
            training/generate_dataset.py training/train_model.py training/convert_ptq.py training/prune_quantise.py \
            inference/Dockerfile inference/inference_service.py inference/requirements.txt
          do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
            echo "ok  $f"
          done

      - name: Python syntax check
        run: python -m compileall -q data_pipeline training inference

  train-m1:
    name: Train M1 (FP32 baseline)
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install $TRAIN_DEPS
          pip freeze > pip-freeze-train.txt
          python -c "import tensorflow as tf; print('TensorFlow', tf.__version__)"

      - name: Train M1
        run: python training/train_model.py 2>&1 | tee m1_train.log

      - name: Check M1 model was saved (accuracy >= 88%)
        run: |
          test -s cold_chain_mlp_fp32.keras || { echo "::error::M1 model not saved — validation accuracy below 88%"; exit 1; }
          ls -la cold_chain_mlp_fp32.keras

      - name: Upload M1 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-m1-fp32
          path: |
            cold_chain_mlp_fp32.keras
            m1_train.log
            pip-freeze-train.txt
          if-no-files-found: error
          retention-days: 14

  convert-m2:
    name: Convert M2 (PTQ INT8)
    needs: train-m1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install $TRAIN_DEPS

      - name: Download M1 model
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-m1-fp32

      - name: Convert M1 to INT8 TFLite
        run: python training/convert_ptq.py 2>&1 | tee m2_convert.log

      - name: Inspect M2 model
        run: |
          test -s cold_chain_mlp_ptq_int8.tflite || { echo "::error::M2 model not produced"; exit 1; }
          python - <<'PY'
          import os
          import tensorflow as tf
          path = "cold_chain_mlp_ptq_int8.tflite"
          interp = tf.lite.Interpreter(model_path=path)
          interp.allocate_tensors()
          i = interp.get_input_details()[0]
          o = interp.get_output_details()[0]
          print(f"file size : {os.path.getsize(path) / 1024:.1f} KB")
          print(f"input     : shape={i['shape'].tolist()} dtype={i['dtype'].__name__} quant(scale,zp)={i['quantization']}")
          print(f"output    : shape={o['shape'].tolist()} dtype={o['dtype'].__name__} quant(scale,zp)={o['quantization']}")
          PY

      - name: Upload M2 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-m2-ptq-int8
          path: |
            cold_chain_mlp_ptq_int8.tflite
            m2_convert.log
          if-no-files-found: error
          retention-days: 14

  prune-m3:
    name: Prune + quantise M3
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_USE_LEGACY_KERAS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install training + pruning dependencies
        run: |
          python -m pip install --upgrade pip
          pip install $TRAIN_DEPS $PRUNE_DEPS

      - name: Prune and convert to INT8 TFLite
        run: python training/prune_quantise.py 2>&1 | tee m3_prune.log

      - name: Inspect M3 model
        run: |
          test -s cold_chain_mlp_pruned_int8.tflite || { echo "::error::M3 model not produced"; exit 1; }
          python - <<'PY'
          import os
          import numpy as np
          import tensorflow as tf
          model = tf.keras.models.load_model("cold_chain_mlp_pruned.keras")
          for layer in model.layers:
              if layer.get_weights():
                  k = layer.get_weights()[0]
                  print(f"{layer.name:<10} kernel={list(k.shape)} sparsity={np.mean(k == 0):.1%}")
          path = "cold_chain_mlp_pruned_int8.tflite"
          interp = tf.lite.Interpreter(model_path=path)
          interp.allocate_tensors()
          i = interp.get_input_details()[0]
          o = interp.get_output_details()[0]
          print(f"file size : {os.path.getsize(path) / 1024:.1f} KB")
          print(f"input     : shape={i['shape'].tolist()} dtype={i['dtype'].__name__} quant(scale,zp)={i['quantization']}")
          print(f"output    : shape={o['shape'].tolist()} dtype={o['dtype'].__name__} quant(scale,zp)={o['quantization']}")
          PY

      - name: Upload M3 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-m3-pruned-int8
          path: |
            cold_chain_mlp_pruned_int8.tflite
            cold_chain_mlp_pruned.keras
            m3_prune.log
          if-no-files-found: error
          retention-days: 14

  build-image:
    name: Build image + MQTT integration test
    needs: train-m1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRUCK_ID: truck_001
      MODEL_PATH: cold_chain_mlp_fp32.keras
      ANOMALY_MODE: combined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download M1 model into build context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-m1-fp32

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: inference/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size and layers
        run: |
          docker image ls "$IMAGE_NAME"
          docker history --no-trunc=false "$IMAGE_NAME:$GITHUB_SHA"

      - name: Model loads inside container
        run: |
          docker run --rm --entrypoint python -e MODEL_PATH="$MODEL_PATH" "$IMAGE_NAME:$GITHUB_SHA" -c "
          import os, tensorflow as tf
          m = tf.keras.models.load_model(os.environ['MODEL_PATH'])
          print('loaded', os.environ['MODEL_PATH'], 'params', m.count_params())
          "

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install simulator dependencies
        run: pip install paho-mqtt

      - name: Start Mosquitto broker
        run: |
          printf 'listener 1883\nallow_anonymous true\n' > "$RUNNER_TEMP/mosquitto.conf"
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$RUNNER_TEMP/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2

      - name: Start inference container
        run: |
          docker run -d --name inference --network host \
            -e MODEL_PATH="$MODEL_PATH" \
            -e TRUCK_ID="$TRUCK_ID" \
            -e MQTT_BROKER=localhost \
            -e MQTT_PORT=1883 \
            -e PYTHONUNBUFFERED=1 \
            "$IMAGE_NAME:$GITHUB_SHA"
          for i in $(seq 1 120); do
            if grep -q "Connected successfully" <(docker logs inference 2>&1); then
              echo "Inference service connected after ${i}s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' inference)" != "true" ]; then
              echo "::error::inference container exited"
              exit 1
            fi
            sleep 1
          done
          echo "::error::inference service did not connect to broker within 120s"
          exit 1

      - name: Start simulator
        run: |
          nohup python data_pipeline/simulator.py --anomaly "$ANOMALY_MODE" > "$RUNNER_TEMP/simulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simulator.pid"

      - name: Subscribe to inference topic
        run: |
          docker exec mosquitto mosquitto_sub -h localhost \
            -t "logibridge/trucks/$TRUCK_ID/inference" -C 3 -W 120 \
            | tee "$RUNNER_TEMP/inference.jsonl"

      - name: Validate inference payloads
        run: |
          python - "$RUNNER_TEMP/inference.jsonl" <<'PY'
          import json, os, sys
          truck = os.environ["TRUCK_ID"]
          rows = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          assert rows, "no payloads received"
          for r in rows:
              assert {"truck_id", "status", "confidence", "timestamp"} <= set(r), r
              assert r["truck_id"] == truck, r
              assert r["status"] in {"NORMAL", "WARNING", "CRITICAL"}, r
              assert 0.0 <= r["confidence"] <= 1.0, r
              print(f'{r["status"]:<9} confidence={r["confidence"]:.3f}')
          print(f"OK: {len(rows)} valid payloads on logibridge/trucks/{truck}/inference")
          PY

      - name: Dump logs
        if: always()
        run: |
          echo "::group::inference container"; docker logs inference 2>&1 | tail -n 100 || true; echo "::endgroup::"
          echo "::group::simulator"; tail -n 50 "$RUNNER_TEMP/simulator.log" || true; echo "::endgroup::"
          echo "::group::mosquitto"; docker logs mosquitto 2>&1 | tail -n 50 || true; echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/simulator.pid" 2>/dev/null)" 2>/dev/null || true
          docker rm -f inference mosquitto 2>/dev/null || true
